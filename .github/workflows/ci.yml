name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: nikolareljin/ci-helpers/.github/workflows/ci.yml@production
    with:
      timeout_minutes: 15
      submodules: recursive
      install_command: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq ruby-full
        sudo gem install --no-document bundler -v 4.0.23
        bundle config set path vendor/bundle
        bundle install --jobs 4 --retry 3
      lint_command: |
        sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
        shellcheck -S warning -x dev build test site scripts/check.sh scripts/project.sh
      test_command: ./dev test
      build_command: ./dev build docs
