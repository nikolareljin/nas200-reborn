<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-labelledby="title desc"><title id="title">NAS200 rebuild validation flow</title><desc id="desc">The work progresses from donor evidence through bench power, storage, enclosure, thermal checks, and public guide release.</desc><style>text{font-family:sans-serif;font-size:16px;fill:#13233a}.box{fill:#eef5fb;stroke:#24527a;stroke-width:2}.line{stroke:#24527a;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#24527a"/></marker></defs><rect class="box" x="20" y="75" width="130" height="70" rx="8"/><text x="45" y="104">Donor probe</text><text x="40" y="126">and evidence</text><rect class="box" x="190" y="75" width="130" height="70" rx="8"/><text x="212" y="104">Bench power</text><text x="211" y="126">and rails</text><rect class="box" x="360" y="75" width="130" height="70" rx="8"/><text x="384" y="104">Drive and</text><text x="373" y="126">bridge tests</text><rect class="box" x="530" y="75" width="130" height="70" rx="8"/><text x="554" y="104">Enclosure and</text><text x="555" y="126">GPIO tests</text><rect class="box" x="700" y="75" width="130" height="70" rx="8"/><text x="727" y="104">Closed-lid</text><text x="717" y="126">thermal soak</text><rect class="box" x="870" y="75" width="110" height="70" rx="8"/><text x="893" y="104">Publish</text><text x="886" y="126">guide</text><path class="line" d="M150 110H190M320 110H360M490 110H530M660 110H700M830 110H870"/><text x="20" y="190">Each stage records evidence and stops on electrical, storage, thermal, or safety failure.</text></svg>
