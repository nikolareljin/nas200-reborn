<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">Proposed NAS200 rebuild data topology</title><desc id="desc">Two SATA drives use individual USB bridges and share the Raspberry Pi 3 USB 2 bus.</desc><style>text{font-family:sans-serif;font-size:18px;fill:#13233a}.box{fill:#eef5fb;stroke:#24527a;stroke-width:2}.line{stroke:#24527a;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#24527a"/></marker></defs><rect class="box" x="25" y="55" width="145" height="60" rx="8"/><text x="48" y="92">Upper drive</text><rect class="box" x="25" y="180" width="145" height="60" rx="8"/><text x="41" y="217">Lower drive</text><rect class="box" x="260" y="55" width="165" height="60" rx="8"/><text x="282" y="92">SATA USB bridge</text><rect class="box" x="260" y="180" width="165" height="60" rx="8"/><text x="282" y="217">SATA USB bridge</text><rect class="box" x="525" y="115" width="180" height="70" rx="8"/><text x="547" y="145">Pi 3 shared</text><text x="555" y="169">USB 2 host</text><rect class="box" x="795" y="115" width="135" height="70" rx="8"/><text x="823" y="145">SMB and</text><text x="812" y="169">Ethernet</text><path class="line" d="M170 85H260M170 210H260M425 85H480V135H525M425 210H480V165H525M705 150H795"/><text x="25" y="280">Status: proposed. Both bridges share the Pi USB 2 bus; validate SMART, reset recovery, and load behavior.</text></svg>
