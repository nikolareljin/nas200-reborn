<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">Proposed NAS200 rebuild power tree</title><desc id="desc">Twelve volt input feeds a fuse and distribution. A buck converter produces five volts for the drives and Pi.</desc><style>text{font-family:sans-serif;font-size:18px;fill:#13233a}.box{fill:#eef5fb;stroke:#24527a;stroke-width:2}.warn{fill:#fff4db;stroke:#a86700;stroke-width:2}.line{stroke:#24527a;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#24527a"/></marker></defs><rect class="box" x="30" y="150" width="150" height="60" rx="8"/><text x="49" y="186">12 V input</text><rect class="warn" x="245" y="150" width="130" height="60" rx="8"/><text x="282" y="186">Fuse</text><rect class="box" x="440" y="150" width="170" height="60" rx="8"/><text x="462" y="186">12 V distribution</text><rect class="box" x="440" y="260" width="170" height="60" rx="8"/><text x="469" y="296">5 V buck</text><rect class="box" x="720" y="75" width="180" height="60" rx="8"/><text x="748" y="111">Drive 12 V rail</text><rect class="box" x="720" y="170" width="180" height="60" rx="8"/><text x="746" y="206">Fan after probe</text><rect class="box" x="720" y="260" width="180" height="60" rx="8"/><text x="746" y="286">Drive 5 V and Pi</text><path class="line" d="M180 180H245M375 180H440M610 180H690V105H720M610 180H720M525 210V260M610 290H720"/><text x="30" y="40">Status: proposed. Verify polarity, fuse values, rail load, and connector map on the donor.</text></svg>
