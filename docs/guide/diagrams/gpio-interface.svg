<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">Proposed GPIO interface</title><desc id="desc">Buttons connect to grounded inputs. LEDs use transistor drivers. Fan control is optional after probe.</desc><style>text{font-family:sans-serif;font-size:17px;fill:#13233a}.box{fill:#eef5fb;stroke:#24527a;stroke-width:2}.warn{fill:#fff4db;stroke:#a86700;stroke-width:2}.line{stroke:#24527a;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#24527a"/></marker></defs><rect class="box" x="365" y="105" width="220" height="150" rx="8"/><text x="410" y="140">Raspberry Pi 3B</text><text x="395" y="170">BCM26 / BCM19 inputs</text><text x="390" y="198">BCM20 / BCM21 outputs</text><text x="414" y="226">BCM18 optional PWM</text><rect class="box" x="35" y="45" width="180" height="60" rx="8"/><text x="65" y="80">Shutdown button</text><rect class="box" x="35" y="230" width="180" height="60" rx="8"/><text x="75" y="265">Reboot button</text><rect class="warn" x="735" y="35" width="180" height="65" rx="8"/><text x="762" y="64">LED driver and</text><text x="775" y="86">current resistor</text><rect class="warn" x="735" y="145" width="180" height="65" rx="8"/><text x="762" y="174">LED driver and</text><text x="775" y="196">current resistor</text><rect class="warn" x="735" y="255" width="180" height="65" rx="8"/><text x="762" y="284">Fan controller</text><text x="768" y="306">after fan probe</text><path class="line" d="M215 75H320V145H365M215 260H320V215H365M585 160H735M585 205H680V177H735M585 225H670V287H735"/><text x="35" y="340">Status: proposed. Original panel connector, LED polarity, resistor network, and fan wiring require donor probe evidence.</text></svg>
